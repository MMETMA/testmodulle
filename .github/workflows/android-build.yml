name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Fixed Keystore and Environment
        run: |
          if [ ! -f debug.keystore ] && [ -f keystore.jks ]; then
            cp keystore.jks debug.keystore
          elif [ ! -f debug.keystore ] && [ -f app/keystore.jks ]; then
            cp app/keystore.jks debug.keystore
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding persistent keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # Ensure keystore.jks and debug.keystore are present in both root and app directory
          cp -f debug.keystore keystore.jks 2>/dev/null || true
          cp -f debug.keystore app/keystore.jks 2>/dev/null || true
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true

          if [ ! -f .env ]; then
            touch .env
          fi

          echo "Verifying persistent signing keystore SHA-256 fingerprint:"
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA256|Owner"

      - name: Build Debug APK with Gradle
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx2048m"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIUI-Whitelist-Enabler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
